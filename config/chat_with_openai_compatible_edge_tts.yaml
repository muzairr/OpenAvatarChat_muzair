default:
  logger:
    log_level: "INFO"
  service:
    host: "0.0.0.0"
    port: 8282
    cert_file: "ssl_certs/localhost.crt"
    cert_key: "ssl_certs/localhost.key"
  chat_engine:
    model_root: "models"
    concurrent_limit: 1
    handler_search_path:
      - "src/handlers"
    handler_configs:
      RtcClient:
        module: client/rtc_client/client_handler_rtc
        # max time a session will last for
        connection_ttl: 900
      SileroVad:
        module: vad/silerovad/vad_handler_silero
        speaking_threshold: 0.3  # Lower = more sensitive
        start_delay: 1200  # Fast activation for responsiveness
        end_delay: 3000  # Shorter silence before ending
        buffer_look_back: 6000  # Capture 6s before speech (prevents cutting start)
        speech_padding: 800  # More padding to protect word edges
      SenseVoice:
        enabled: True
        module: asr/sensevoice/asr_handler_sensevoice
        model_name: "iic/SenseVoiceSmall"
        language: "en"  # Set to "en" for English-only for better accuracy ("auto", "zh", "en", "yue", "ja", "ko")
        use_itn: true  # Inverse text normalization for better number/date formatting
      Edge_TTS:
        enabled: False  # Disabled for text-only mode
        module: tts/edgetts/tts_handler_edgetts
        voice: "en-US-AriaNeural"
      LLMOpenAICompatible:
        enabled: True
        module: llm/openai_compatible/llm_handler_openai_compatible
        model_name: "llama3.2:1b"
        enable_video_input: False
        history_length: 20
        system_prompt: "You are an AI assistant. Respond to questions briefly in 2-3 sentences with proper punctuation."
        api_url: "http://127.0.0.1:11434/v1"
        api_key: "ollama"
      LiteAvatar:
        enabled: False  # Disabled for text-only mode (too slow on CPU)
        module: avatar/liteavatar/avatar_handler_liteavatar
        avatar_name: 20250408/sample_data
        fps: 25
        debug: false
        enable_fast_mode: false
        use_gpu: false
