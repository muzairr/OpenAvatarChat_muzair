default:
  logger:
    log_level: "INFO"
  service:
    host: "0.0.0.0"
    port: 8282
    cert_file: "ssl_certs/localhost.crt"
    cert_key: "ssl_certs/localhost.key"
  chat_engine:
    model_root: "models"
    concurrent_limit: 1
    handler_search_path:
      - "src/handlers"
    handler_configs:
      RtcClient:
        module: client/rtc_client/client_handler_rtc
        # max time a session will last for
        connection_ttl: 900
      SileroVad:
        module: vad/silerovad/vad_handler_silero
        speaking_threshold: 0.45  # Slightly more sensitive for faster barge-in detection
        start_delay: 1536  # ~96ms (3 clips) - faster speech start detection for barge-in
        end_delay: 6000  # 375ms silence before ending (reduced from 500ms for faster turnaround)
        buffer_look_back: 6000  # Capture 6s before speech (prevents cutting start)
        speech_padding: 1200  # Extra padding to protect word edges
      SenseVoice:
        enabled: False  # Disabled - causes hallucinations on noise
        module: asr/sensevoice/asr_handler_sensevoice
        model_name: "iic/SenseVoiceSmall"
        language: "en"  # Set to "en" for English-only for better accuracy ("auto", "zh", "en", "yue", "ja", "ko")
        use_itn: true  # Inverse text normalization for better number/date formatting
      WhisperASR:
        enabled: True  # Industry-standard ASR - no hallucinations
        module: asr/whisper/asr_handler_whisper
        model_size: "base"  # tiny, base, small, medium (base is best balance)
        device: "auto"  # Will use GPU if available
        compute_type: "int8"  # Faster, lower memory
        language: "en"  # Force English only
        beam_size: 5  # Good quality
        vad_filter: true  # Use Whisper's built-in VAD for extra filtering
        min_silence_duration_ms: 500  # 500ms silence to split segments
      Edge_TTS:
        enabled: True
        module: tts/edgetts/tts_handler_edgetts
        voice: "en-US-AriaNeural"
      LLMOpenAICompatible:
        enabled: True
        module: llm/openai_compatible/llm_handler_openai_compatible
        model_name: "llama3.2:1b"
        enable_video_input: False
        history_length: 20
        system_prompt: "You are an AI assistant. Respond to questions briefly in 2-3 sentences with proper punctuation."
        api_url: "http://127.0.0.1:11434/v1"
        api_key: "ollama"
      LiteAvatar:
        enabled: True  # Avatar enabled
        module: avatar/liteavatar/avatar_handler_liteavatar
        avatar_name: 20250408/sample_data
        fps: 25
        debug: false
        enable_fast_mode: false
        use_gpu: true  # Enable GPU for avatar rendering
        stop_ack_timeout: 0.5  # Reduced from 5.0 - faster clearing of old audio
